<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#1F2523">
  <link rel="canonical" href="{{site_url}}/{{path}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
</head>
<body class="page">

  <div class="grain" aria-hidden="true"></div>

  <header class="nav is-scrolled" id="nav">
    <div class="nav__inner">
      <a href="/" class="brand" aria-label="Quantact Partners home">
        <img src="/assets/img/logo.png" alt="" class="brand__mark">
        <span class="brand__text">
          <span class="brand__name">Quantact</span>
          <span class="brand__sub">Partners</span>
        </span>
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/#services">Services</a>
        <a href="/#calculators">Calculators</a>
        <a href="/case-studies/">Case Studies</a>
        <a href="/#about">About</a>
      </nav>
      <div class="nav__actions">
        <a href="/#contact" class="btn btn--outline btn--sm">Discuss your accounting needs</a>
        <button class="nav__burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <a href="/">Home</a>
    <a href="/#services">Services</a>
    <a href="/#calculators">Calculators</a>
    <a href="/case-studies/">Case Studies</a>
    <a href="/#about">About</a>
    <a href="/#contact">Discuss your accounting needs</a>
  </div>

  <main class="page__main">
{{body}}
  </main>

{{footer}}

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
