<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#1F2523">
  <link rel="canonical" href="{{site_url}}/{{path}}">
  <link rel="stylesheet" href="{{root}}assets/fonts/fonts.css">
  <link rel="stylesheet" href="{{root}}assets/css/style.css">
  <link rel="icon" type="image/png" href="{{root}}assets/img/logo.png">
</head>
<body class="page">

  <div class="grain" aria-hidden="true"></div>

  <header class="nav is-scrolled" id="nav">
    <div class="nav__inner">
      <a href="{{root}}index.html" class="brand" aria-label="Quantact Partners home">
        <img src="{{root}}assets/img/logo.png" alt="" class="brand__mark">
        <span class="brand__text">
          <span class="brand__name">Quantact</span>
          <span class="brand__sub">Partners</span>
        </span>
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a href="{{root}}index.html">Home</a>
        <a href="{{root}}index.html#services">Services</a>
        <a href="{{root}}index.html#calculators">Calculators</a>
        <a href="{{root}}case-studies/">Case Studies</a>
        <a href="{{root}}index.html#about">About</a>
      </nav>
      <div class="nav__actions">
        <a href="{{root}}index.html#contact" class="btn btn--outline btn--sm">Discuss your accounting needs</a>
        <button class="nav__burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <a href="{{root}}index.html">Home</a>
    <a href="{{root}}index.html#services">Services</a>
    <a href="{{root}}index.html#calculators">Calculators</a>
    <a href="{{root}}case-studies/">Case Studies</a>
    <a href="{{root}}index.html#about">About</a>
    <a href="{{root}}index.html#contact">Discuss your accounting needs</a>
  </div>

  <main class="page__main" id="top">
{{body}}
  </main>

{{footer}}

  <script src="{{root}}assets/js/main.js" defer></script>
</body>
</html>
