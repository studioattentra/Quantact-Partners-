# Netlify build settings (recommended host for the content admin).
# Netlify runs the build on every commit, including commits made from /admin/.
# Only the generated dist/ folder is published, so build files, templates,
# drafts and configuration are never reachable from the web.
# Security headers come from dist/_headers (generated by scripts/security-headers.mjs).

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

# Identity + Git Gateway are switched on in the Netlify dashboard:
#   Site settings → Identity → Enable → Registration: Invite only
#   Identity → Services → Git Gateway → Enable
#   Identity → Invite users → principal's email
