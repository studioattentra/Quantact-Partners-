# Builds the site and publishes ONLY the deployable dist/ folder to the
# `hostinger` branch. hPanel → Git pulls that branch into public_html, so the
# live server never receives source files, drafts, templates or config.
#
# Runs on every push to main (including commits made from /admin/), once a
# day (so case studies scheduled with a future date go live) and on demand.
#
# Optional secret HOSTINGER_DEPLOY_HOOK: the "Auto deployment" webhook URL
# from hPanel → Git. When set, the live site updates within a minute instead
# of waiting for Hostinger's next pull.

name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - "case-studies/**"
      - "privacy.html"
      - "disclaimer.html"
      - "sitemap.xml"
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run audit
      - run: npm run lint:php

      - name: Keep generated pages in main (for browsing/preview)
        run: |
          git config user.name "quantact-site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add case-studies sitemap.xml privacy.html disclaimer.html
          if git diff --cached --quiet; then
            echo "Generated pages unchanged."
          else
            git commit -m "Build case studies"
            git push
          fi

      - name: Publish dist/ to the hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger
          force_orphan: true
          enable_jekyll: true          # keeps the .htaccess (no .nojekyll filtering)
          exclude_assets: ""
          user_name: quantact-site-bot
          user_email: site-bot@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"

      - name: Tell Hostinger to pull
        if: ${{ secrets.HOSTINGER_DEPLOY_HOOK != '' }}
        env:
          HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        run: curl -fsS --max-time 30 -X POST "$HOOK" || echo "Webhook call failed; Hostinger will pull on its next cycle."
